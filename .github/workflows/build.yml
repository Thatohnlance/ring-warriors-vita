name: Build Ring Warriors Vita

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Build VPK using VitaSDK
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            vitasdk/vitasdk:2026.08 \
            sh -lc 'cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" && cmake --build build --verbose'

      - name: Upload VPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ring-warriors-vita-vpk
          path: build/*.vpk
          if-no-files-found: error
